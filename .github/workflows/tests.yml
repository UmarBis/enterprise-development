name: CI

on:
  push:
    branches: [ main, lab1 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore tests/FitnessClub.Tests/FitnessClub.Tests.csproj

      - name: Build
        run: dotnet build tests/FitnessClub.Tests/FitnessClub.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/FitnessClub.Tests/FitnessClub.Tests.csproj --no-build --configuration Release --verbosity normal
